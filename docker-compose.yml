version: '3.8'

services:
  # ---------- DATABASES ----------
  postgres:
    image: postgres:15
    container_name: auriance-postgres
    environment:
      POSTGRES_DB: auriance_medical
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 110603
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: auriance-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: auriance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redispass123
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: auriance-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: auriance-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongopass123
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: auriance-neo4j
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/neo4jpass123
      NEO4J_dbms_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  # ---------- VOICE SERVICES ----------
  voice-processor:
    build: ./services/voice-processor
    container_name: auriance-voice-processor
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - REDIS_URL=redis://:redispass123@redis:6379/0
      - POSTGRES_URL=postgresql://postgres:110603@postgres:5432/auriance_medical
      - MONGO_URL=mongodb://admin:mongopass123@mongo:27017
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - VAD_THRESHOLD=0.3
    volumes:
      - whisper_cache:/root/.cache/whisper
      - ./services/voice-processor:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    restart: unless-stopped

  voice-websocket:
    build: ./services/voice-websocket
    container_name: auriance-voice-websocket
    ports:
      - "8001:8001"
    environment:
      - VOICE_PROCESSOR_URL=http://voice-processor:8000
      - REDIS_URL=redis://:redispass123@redis:6379/1
    depends_on:
      - voice-processor
      - redis
    restart: unless-stopped

  # ---------- NLP SERVICES ----------
  nlp-processor:
    build: ./services/nlp-processor
    container_name: auriance-nlp-processor
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_URL=postgresql://postgres:110603@postgres:5432/auriance_medical
      - MONGO_URL=mongodb://admin:mongopass123@mongo:27017
      - QDRANT_URL=http://qdrant:6333
      - SPACY_MODEL=fr_core_news_lg
    volumes:
      - spacy_models:/root/.cache/spacy
    depends_on:
      - postgres
      - mongo
      - qdrant
    restart: unless-stopped

  # ---------- API GATEWAY ----------
  api-gateway:
    build: ./services/api-gateway
    container_name: auriance-api-gateway
    ports:
      - "8080:8080"
    environment:
      - VOICE_PROCESSOR_URL=http://voice-processor:8000
      - VOICE_WEBSOCKET_URL=ws://voice-websocket:8001
      - NLP_PROCESSOR_URL=http://nlp-processor:8002
      - JWT_SECRET=auriance_super_secret_key_2024
    depends_on:
      - voice-processor
      - voice-websocket
      - nlp-processor
    restart: unless-stopped

  # ---------- MONITORING ----------
  prometheus:
    image: prom/prometheus:latest
    container_name: auriance-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: auriance-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

  # ---------- TRANSLATION SERVICE ----------
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: auriance-libretranslate
    ports:
      - "5000:5000"
    environment:
      - LT_LOAD_ONLY=fr,en,es,de,it,pt,ar,zh,ja,ko,hi,ru
      - LT_BATCH_SIZE=1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/languages"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------- INIT SERVICES ----------
  init-qdrant:
    build: ./init/qdrant-init
    container_name: auriance-init-qdrant
    depends_on:
      qdrant:
        condition: service_started
    environment:
      - QDRANT_URL=http://qdrant:6333
    restart: "no"

  init-minio:
    build: ./init/minio-init
    container_name: auriance-init-minio
    depends_on:
      minio:
        condition: service_started
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
    restart: "no"

  init-postgres:
    build: ./init/postgres-init
    container_name: auriance-init-postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_URL=postgresql://postgres:110603@postgres:5432/auriance_medical
    restart: "no"

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
  mongo_data:
  neo4j_data:
  neo4j_logs:
  whisper_cache:
  spacy_models:
  prometheus_data:
  grafana_data: